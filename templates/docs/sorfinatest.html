<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>WLC APs</title>
    <!-- Include jQuery and DataTables CSS/JS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.5/css/jquery.dataTables.min.css" />
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
</head>
<body>

<h1>WLC Access Points</h1>

{% for wlc in wlcs %}
    <h2>WLC IP: {{ wlc.managementIpAddress }}</h2>
    <!-- Office Filter Buttons -->
    <div>
        <button class="filter-btn" data-wlc="{{ loop.index0 }}" data-office="MY">Malaysia</button>
        <button class="filter-btn" data-wlc="{{ loop.index0 }}" data-office="PH">Philippines</button>
        <button class="filter-btn" data-wlc="{{ loop.index0 }}" data-office="SG">Singapore</button>
        <button class="reset-btn" data-wlc="{{ loop.index0 }}">Reset Filter</button>
    </div>

    <!-- Table for this WLC -->
    <table id="table-wlc-{{ loop.index0 }}" class="display" style="width:100%">
        <thead>
            <tr>
                <th>AP Name</th>
                <th>Associated WLC IP</th>
                <th>Office</th>
            </tr>
        </thead>
        <tbody>
            {% for a in ap_wlc[wlc.managementIpAddress] %}
                <tr>
                    <td>{{ a.hostname if a.hostname else 'N/A' }}</td> <!-- Assuming AP has a name -->
                    <td>{{ a.associatedWlcIp }}</td>
                    <td>{{ a.office }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
    <br/>
{% endfor %}

<script>
$(document).ready(function() {
    // Initialize all DataTables
    {% for wlc in wlcs %}
        $('#table-wlc-{{ loop.index0 }}').DataTable();
    {% endfor %}

    // Handle filter buttons
    $('.filter-btn').click(function() {
        var wlcIndex = $(this).data('wlc');
        var office = $(this).data('office');

        var table = $('#table-wlc-' + wlcIndex).DataTable();

		// Apply filter
		table.column(2).search(office).draw();

		// Reset to the first page
		table.page(0).draw('page');

       // Filter rows based on office
		table.rows().every(function(rowIdx, tableLoop, rowLoop) {
			var data = this.data();
			// data[2] is the Office column
			if (data[2] === office) {
				$(this.node()).show();
			} else {
				$(this.node()).hide();
			}
		});
    });

    // Handle reset filter
    $('.reset-btn').click(function() {
        var wlcIndex = $(this).data('wlc');
        var table = $('#table-wlc-' + wlcIndex).DataTable();
        table.rows().every(function(rowIdx, tableLoop, rowLoop) {
            $(this.node()).show();
        });
    });
});
</script>

</body>
</html>
