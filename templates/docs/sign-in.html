<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="description" content="Responsive Bootstrap 5 Admin &amp; Dashboard Template">
	<meta name="author" content="Bootlab">

	<title>Sign In | AppStack - Bootstrap 5 Admin &amp; Dashboard Template</title>

	<link rel="canonical" href="https://appstack.bootlab.io/pages-sign-in.html" />
	<link rel="shortcut icon" href="img/favicon.ico">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
	<link href="{{ url_for('static',filename='assets/css/light.css') }}" rel="stylesheet">

</head>
<!--
  HOW TO USE:
  data-theme: default (default), dark, light
  data-layout: fluid (default), boxed
  data-sidebar-position: left (default), right
  data-sidebar-behavior: sticky (default), fixed, compact
-->

<body data-theme="default" data-layout="fluid" data-sidebar-position="left" data-sidebar-behavior="sticky">
	<div class="main d-flex justify-content-center w-100">
		<main class="content d-flex p-0">
			<div class="container d-flex flex-column">
				<div class="row h-100">
					<div class="col-sm-10 col-md-8 col-lg-6 col-xl-5 mx-auto d-table h-100">
						<div class="d-table-cell align-middle">
							<div class="text-center mt-4">
								<img src="{{ url_for('static', filename='/assets/img/AGO!.png') }}" alt="AXA GO" x="0px" y="0px" class="mb-4"
								width="120px" height="120px" viewBox="0 0 20 20" enable-background="new 0 0 20 20">
								<h1 class="h2">Welcome!</h1>
								<p class="lead">
									{{ message }}
								</p>
							</div>

							<div class="card">
								<div class="card-body">
									<div class="m-sm-3">
										<!-- <div class="d-grid gap-2 mb-3">
											<a class="btn btn-google btn-lg" href="dashboard-default.html"><i class="fab fa-fw fa-google"></i> Sign in with Google</a>
											<a class="btn btn-facebook btn-lg" href="dashboard-default.html"><i class="fab fa-fw fa-facebook-f"></i> Sign in with Facebook</a>
											<a class="btn btn-microsoft btn-lg" href="dashboard-default.html"><i class="fab fa-fw fa-microsoft"></i> Sign in with Microsoft</a>
										</div> -->
										<div class="row">
											<!-- <div class="col">
												<hr>
											</div> -->
											<!-- <div class="col-auto text-uppercase d-flex align-items-center">Or</div> -->
											<!-- <div class="col">
												<hr>
											</div> -->
										</div>
										<form action="{{ url_for('sign_in') }}" method="POST">
											<div class="mb-3">
												<label class="form-label">Email</label>
												<input class="form-control form-control-lg" type="email" name="email" placeholder="Enter your email" />
											</div>
											<div class="mb-3">
												<label class="form-label">Password</label>
												<input class="form-control form-control-lg" type="password" name="password" placeholder="Enter your password" />
												<small>
            <!-- <a href="pages-reset-password.html">Forgot password?</a> -->
          </small>
											</div>
											<!-- <div>
												<div class="form-check align-items-center">
													<input id="customControlInline" type="checkbox" class="form-check-input" value="remember-me" name="remember-me" checked>
													<label class="form-check-label text-small" for="customControlInline">Remember me</label>
												</div>
											</div> -->
											
											<div class="d-grid gap-2 mt-3">
												<button type="submit" class="btn btn-lg btn-primary">Sign in</button>
											</div>

										</form>
									</div>
								</div>
							</div>
							<!-- <div class="text-center mb-3">
								Don't have an account? <a href="pages-sign-up.html">Sign up</a>
							</div> -->
						</div>
					</div>
				</div>
			</div>
		</main>
	</div>

	<script src="{{ url_for('static', filename='assets/js/app.js') }}"></script>

</body>

</html>
